name: Temporary A11y Label Fix

on:
  push:
    branches:
      - feat/p4-8-a11y-seo-hardening

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Keep contact section heading available to assistive tech
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/ContactSection.tsx')
          s = p.read_text()
          old = '''          {!submittedCode && (\n            <h2\n              id="contact-form-title"\n              className="mb-10 font-serif text-3xl font-bold text-[#302D28] sm:mb-12 sm:text-4xl"\n            >\n              Formulario de Consulta Confidencial\n            </h2>\n          )}'''
          new = '''          <h2\n            id="contact-form-title"\n            className={`${submittedCode ? 'sr-only' : 'mb-10 font-serif text-3xl font-bold text-[#302D28] sm:mb-12 sm:text-4xl'}`}\n          >\n            Formulario de Consulta Confidencial\n          </h2>'''
          if old not in s:
              raise SystemExit('expected contact heading block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ContactSection.tsx
          git commit -m 'a11y: preserve contact section accessible name'
          git push
