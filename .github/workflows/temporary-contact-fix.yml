name: Temporary Contact Fix

on:
  push:
    branches:
      - feat/p4-8-a11y-seo-hardening

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply minimal semantic fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/ContactSection.tsx')
          s = p.read_text()
          s = s.replace('title="Evaluación de Caso"', 'title="Contacto letrado | Evaluación de Caso"', 1)
          s = s.replace('<main className="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8 lg:py-24">', '<section aria-labelledby="contact-form-title" className="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8 lg:py-24">', 1)
          marker = '''          {submittedCode ? ('''
          heading = '''          {submittedCode ? ('''
          if 'id="contact-form-title"' not in s:
              s = s.replace(heading, '''          {!submittedCode && (\n            <h2\n              id="contact-form-title"\n              className="mb-10 font-serif text-3xl font-bold text-[#302D28] sm:mb-12 sm:text-4xl"\n            >\n              Formulario de Consulta Confidencial\n            </h2>\n          )}\n\n''' + heading, 1)
          # Close the replacement section instead of main.
          last = s.rfind('\n      </main>')
          if last != -1:
              s = s[:last] + '\n      </section>' + s[last + len('\n      </main>'):]
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ContactSection.tsx
          git diff --cached --quiet || git commit -m 'a11y: strengthen contact page heading structure'
          git push
